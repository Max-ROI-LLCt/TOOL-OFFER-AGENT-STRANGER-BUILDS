[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-offer-agent"
version = "0.2.0"
description = "Local, evidence-attributed API and MCP offer drafting"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "uagents==0.26.1",
    "uagents-core==0.4.11",
    "openai==1.99.5",
]

[project.optional-dependencies]
test = ["jsonschema>=4,<5"]

[project.scripts]
tool-offer = "tool_offer_agent.cli:main"

[tool.setuptools]
packages = ["tool_offer_agent"]
py-modules = ["agent"]
